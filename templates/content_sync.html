{% extends "base.html" %}
{% block content %}

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
  <div style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim)">
    Обмен контентом <span style="color:var(--accent)">Ozon ↔ WB</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="match-count" style="font-size:11px;color:var(--text-dim)"></span>
    <button class="btn" id="btn-load" onclick="loadProducts()">⟳ Загрузить товары</button>
    <button class="btn primary" id="btn-apply" disabled onclick="applyContent()">
      ✓ Применить (<span id="sel-count">0</span>)
    </button>
  </div>
</div>

<div style="display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
  <input type="text" id="filter-input" placeholder="🔍 Артикул или название…"
    oninput="filterRows(this.value)"
    style="padding:5px 10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;width:240px">

  <div style="display:flex;gap:12px;align-items:center">
    <span style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px">Поля:</span>
    <label style="font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;gap:4px;align-items:center">
      <input type="checkbox" class="col-toggle" data-col="images"      checked onchange="toggleCol(this)"> Фото
    </label>
    <label style="font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;gap:4px;align-items:center">
      <input type="checkbox" class="col-toggle" data-col="name"        checked onchange="toggleCol(this)"> Название
    </label>
    <label style="font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;gap:4px;align-items:center">
      <input type="checkbox" class="col-toggle" data-col="description" checked onchange="toggleCol(this)"> Описание
    </label>
    <label style="font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;gap:4px;align-items:center">
      <input type="checkbox" class="col-toggle" data-col="attributes"  checked onchange="toggleCol(this)"> Характеристики
    </label>
  </div>

  <div style="margin-left:auto;display:flex;gap:6px">
    <button class="btn" style="font-size:11px;padding:3px 10px" onclick="selectAll()">Выбрать все</button>
    <button class="btn" style="font-size:11px;padding:3px 10px" onclick="deselectAll()">Снять все</button>
    <button class="btn" style="font-size:11px;padding:3px 10px;color:var(--accent);border-color:var(--accent)"
            onclick="selectDiff()">⚡ Только отличия</button>
  </div>
</div>

<div id="status-bar" style="display:none;margin-bottom:12px;padding:10px 14px;font-size:12px;border-left:3px solid var(--accent)"></div>

<div id="loader" style="display:none;text-align:center;padding:60px 0;color:var(--text-dim)">
  <div id="loader-steps" style="display:inline-flex;flex-direction:column;gap:10px;text-align:left">
    <div id="step-ozon" style="font-size:12px;opacity:.4">○ Загружаем товары Ozon...</div>
    <div id="step-wb"   style="font-size:12px;opacity:.4">○ Загружаем карточки WB...</div>
    <div id="step-match" style="font-size:12px;opacity:.4">○ Сопоставляем по артикулу...</div>
  </div>
  <div id="loader-timer" style="font-size:11px;color:var(--text-dim);margin-top:16px">0 сек</div>
</div>

<div id="table-wrap" style="display:none">
  <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:12px" id="sync-table">
      <thead>
        <tr style="border-bottom:1px solid var(--border)">
          <th style="width:32px;padding:6px 8px;text-align:center">
            <input type="checkbox" id="check-all" onchange="toggleAll(this.checked)">
          </th>
          <th style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px;width:110px">Артикул</th>
          <th class="th-images" style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px">
            Фото <span style="color:var(--accent);font-size:9px">WB→OZ</span>
          </th>
          <th class="th-name" style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px">
            Название <span style="color:var(--accent);font-size:9px">WB→OZ</span>
          </th>
          <th class="th-description" style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px">
            Описание <span style="color:var(--accent);font-size:9px">WB→OZ</span>
          </th>
          <th class="th-attributes" style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px">
            Характеристики <span style="color:var(--accent);font-size:9px">WB→OZ</span>
          </th>
        </tr>
      </thead>
      <tbody id="sync-body"></tbody>
    </table>
  </div>
</div>

<div id="result-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--surface);border:1px solid var(--border);max-width:600px;width:90%;max-height:80vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)">
      <span style="font-size:12px;text-transform:uppercase;letter-spacing:1px">Результат применения</span>
      <button onclick="closeResultModal()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px">✕</button>
    </div>
    <div id="result-body" style="padding:16px;font-size:12px"></div>
  </div>
</div>

<style>
.cmp{display:grid;grid-template-columns:1fr 1fr 24px;gap:6px;align-items:start}
.cmp-lbl{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.val-oz{background:rgba(59,130,246,.08);border-left:2px solid rgba(59,130,246,.3);padding:3px 6px}
.val-wb{background:rgba(255,106,0,.06);border-left:2px solid rgba(255,106,0,.2);padding:3px 6px}
td.diff .val-wb{background:rgba(255,193,7,.12);border-left:2px solid rgba(255,193,7,.6)}
.thumbs{display:flex;gap:3px;flex-wrap:wrap}
.thumbs img{width:48px;height:48px;object-fit:cover}
.txt3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.attr-scroll{max-height:100px;overflow-y:auto}
.attr-scroll div{border-bottom:1px solid var(--border);padding:1px 0;color:var(--text-dim)}
.attr-scroll div b{color:var(--text)}
tr.sel-row{background:rgba(255,106,0,.04)}
tr{border-bottom:1px solid var(--border)}
td{padding:8px;vertical-align:top}
</style>

<script>
let allProducts=[];

async function loadProducts(){
  setLoader(true);hideStatus();
  document.getElementById('table-wrap').style.display='none';
  document.getElementById('match-count').textContent='';
  try{
    const r=await fetch('/api/content-sync/products');
    const data=await r.json();
    if(!r.ok)throw new Error(data.detail||r.statusText);
    allProducts=data;
    renderTable(data);
    document.getElementById('match-count').textContent=data.length+' товаров';
    document.getElementById('table-wrap').style.display='';
  }catch(e){showStatus(e.message,'error');}
  finally{setLoader(false);}
}

function renderTable(products){
  const tbody=document.getElementById('sync-body');
  tbody.innerHTML='';
  products.forEach(p=>tbody.appendChild(makeRow(p)));
  updateBtn();
}

function makeRow(p){
  const o=p.ozon||{},w=p.wb||{};
  const tr=document.createElement('tr');
  tr.dataset.code=p.vendor_code;
  const imgsDiff=JSON.stringify(o.images)!==JSON.stringify(w.images);
  const nameDiff=(o.name||'')!==(w.name||'');
  const descDiff=(o.description||'')!==(w.description||'');
  const ozImgs=(o.images||[]).slice(0,3).map(u=>`<img src="${u}" onerror="this.style.display='none'">`).join('');
  const wbImgs=(w.images||[]).slice(0,3).map(u=>`<img src="${u}" onerror="this.style.display='none'">`).join('');
  const ozAttrs=(o.attributes||[]).map(a=>`<div><b>${x(a.name)}</b>: ${x(a.value)}</div>`).join('');
  const wbAttrs=(w.attributes||[]).map(a=>`<div><b>${x(a.name)}</b>: ${x(a.value)}</div>`).join('');
  tr.innerHTML=`
    <td style="text-align:center;width:32px">
      <input type="checkbox" class="row-cb" data-code="${p.vendor_code}" onchange="syncRow(this)">
    </td>
    <td><span style="color:var(--accent);font-size:11px">${x(p.vendor_code)}</span></td>
    <td class="td-images${imgsDiff?' diff':''}">
      <div class="cmp">
        <div><div class="cmp-lbl">Ozon</div><div class="val-oz thumbs">${ozImgs||'<span style="color:var(--text-dim)">нет</span>'}</div></div>
        <div><div class="cmp-lbl">WB</div><div class="val-wb thumbs">${wbImgs||'<span style="color:var(--text-dim)">нет</span>'}</div></div>
        <div style="padding-top:20px"><input type="checkbox" class="field-cb" data-code="${p.vendor_code}" data-field="images" onchange="updateBtn()"></div>
      </div>
    </td>
    <td class="td-name${nameDiff?' diff':''}">
      <div class="cmp">
        <div><div class="cmp-lbl">Ozon</div><div class="val-oz txt3">${x(o.name)}</div></div>
        <div><div class="cmp-lbl">WB</div><div class="val-wb txt3">${x(w.name)}</div></div>
        <div style="padding-top:20px"><input type="checkbox" class="field-cb" data-code="${p.vendor_code}" data-field="name" onchange="updateBtn()"></div>
      </div>
    </td>
    <td class="td-description${descDiff?' diff':''}">
      <div class="cmp">
        <div><div class="cmp-lbl">Ozon</div><div class="val-oz txt3">${x(o.description)}</div></div>
        <div><div class="cmp-lbl">WB</div><div class="val-wb txt3">${x(w.description)}</div></div>
        <div style="padding-top:20px"><input type="checkbox" class="field-cb" data-code="${p.vendor_code}" data-field="description" onchange="updateBtn()"></div>
      </div>
    </td>
    <td class="td-attributes">
      <div class="cmp">
        <div><div class="cmp-lbl">Ozon</div><div class="val-oz attr-scroll">${ozAttrs||'—'}</div></div>
        <div><div class="cmp-lbl">WB</div><div class="val-wb attr-scroll">${wbAttrs||'—'}</div></div>
        <div style="padding-top:20px"><input type="checkbox" class="field-cb" data-code="${p.vendor_code}" data-field="attributes" onchange="updateBtn()"></div>
      </div>
    </td>`;
  return tr;
}

function syncRow(master){
  const code=master.dataset.code;
  document.querySelectorAll(`.field-cb[data-code="${code}"]`).forEach(cb=>cb.checked=master.checked);
  master.closest('tr').classList.toggle('sel-row',master.checked);
  updateBtn();
}
function toggleAll(checked){
  document.querySelectorAll('.row-cb').forEach(cb=>{cb.checked=checked;syncRow(cb);});
}
function selectAll(){
  document.querySelectorAll('.field-cb').forEach(cb=>cb.checked=true);
  document.querySelectorAll('.row-cb').forEach(cb=>{cb.checked=true;cb.closest('tr').classList.add('sel-row');});
  updateBtn();
}
function deselectAll(){
  document.querySelectorAll('.field-cb,.row-cb').forEach(cb=>cb.checked=false);
  document.querySelectorAll('tr').forEach(tr=>tr.classList.remove('sel-row'));
  updateBtn();
}
function selectDiff(){
  document.querySelectorAll('.field-cb').forEach(cb=>{
    cb.checked=cb.closest('td')?.classList.contains('diff')||false;
  });
  document.querySelectorAll('.row-cb').forEach(master=>{
    const code=master.dataset.code;
    const any=[...document.querySelectorAll(`.field-cb[data-code="${code}"]`)].some(c=>c.checked);
    master.checked=any;
    master.closest('tr').classList.toggle('sel-row',any);
  });
  updateBtn();
}
function collectTasks(){
  const map={};
  document.querySelectorAll('.field-cb:checked').forEach(cb=>{
    const c=cb.dataset.code;
    if(!map[c])map[c]={vendor_code:c,fields:[]};
    map[c].fields.push(cb.dataset.field);
  });
  return Object.values(map);
}
function updateBtn(){
  const n=collectTasks().length;
  document.getElementById('sel-count').textContent=n;
  document.getElementById('btn-apply').disabled=n===0;
  document.querySelectorAll('.row-cb').forEach(master=>{
    const code=master.dataset.code;
    const fields=[...document.querySelectorAll(`.field-cb[data-code="${code}"]`)];
    const cnt=fields.filter(f=>f.checked).length;
    master.checked=cnt===fields.length&&cnt>0;
    master.indeterminate=cnt>0&&cnt<fields.length;
  });
}

async function applyContent(){
  const tasks=collectTasks();
  if(!tasks.length)return;
  if(!confirm(`Применить WB-контент к ${tasks.length} товарам на Ozon?`))return;
  document.getElementById('btn-apply').disabled=true;
  setLoader(true,`Применяем контент для ${tasks.length} товаров…`);
  hideStatus();
  try{
    const r=await fetch('/api/content-sync/apply',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tasks})
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data.detail||r.statusText);
    showResults(data);
  }catch(e){showStatus(e.message,'error');}
  finally{setLoader(false);updateBtn();}
}

function showResults(data){
  const ok=data.results.filter(r=>r.status==='ok');
  const err=data.results.filter(r=>r.status!=='ok');
  let html=`<div style="color:var(--green);margin-bottom:10px">✓ Успешно: ${ok.length} из ${data.total}</div>`;
  if(err.length){
    html+=`<div style="color:var(--red);margin-bottom:6px">✕ Ошибки (${err.length}):</div><ul style="margin:0;padding-left:16px">`;
    err.forEach(r=>html+=`<li style="color:var(--text-dim);margin-bottom:2px"><code style="color:var(--accent)">${x(r.vendor_code)}</code>: ${x(r.error)}</li>`);
    html+='</ul>';
  }
  document.getElementById('result-body').innerHTML=html;
  document.getElementById('result-modal').style.display='flex';
}
function closeResultModal(){document.getElementById('result-modal').style.display='none';}

function filterRows(q){
  q=q.toLowerCase();
  document.querySelectorAll('#sync-body tr').forEach(tr=>{
    const code=tr.dataset.code?.toLowerCase()||'';
    const name=tr.querySelector('.td-name .val-oz')?.textContent?.toLowerCase()||'';
    tr.style.display=(code.includes(q)||name.includes(q))?'':'none';
  });
}
function toggleCol(cb){
  const col=cb.dataset.col;
  document.querySelectorAll(`.td-${col},.th-${col}`).forEach(el=>el.style.display=cb.checked?'':'none');
}
function x(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let _loaderTimer = null;
let _loaderSec = 0;

function setLoader(on) {
  document.getElementById('loader').style.display = on ? '' : 'none';
  document.getElementById('btn-load').disabled = on;

  if (on) {
    // Сбрасываем шаги
    ['step-ozon','step-wb','step-match'].forEach(id => {
      const el = document.getElementById(id);
      el.style.opacity = '.4';
      el.textContent = '○ ' + el.textContent.replace(/^[●○] /, '');
    });
    _loaderSec = 0;
    document.getElementById('loader-timer').textContent = '0 сек';

    // Анимируем шаги
    setTimeout(() => activateStep('step-ozon',  'Загружаем товары Ozon...'), 100);
    setTimeout(() => activateStep('step-wb',    'Загружаем карточки WB...'), 3000);
    setTimeout(() => activateStep('step-match', 'Сопоставляем по артикулу...'), 6000);

    // Таймер
    _loaderTimer = setInterval(() => {
      _loaderSec++;
      const el = document.getElementById('loader-timer');
      if (el) el.textContent = _loaderSec + ' сек' + (_loaderSec > 15 ? ' — большой каталог, ждите…' : '');
    }, 1000);
  } else {
    clearInterval(_loaderTimer);
  }
}

function activateStep(id, text) {
  const el = document.getElementById(id);
  if (!el || document.getElementById('loader').style.display === 'none') return;
  // Предыдущий шаг отмечаем как выполненный
  const steps = ['step-ozon','step-wb','step-match'];
  const idx = steps.indexOf(id);
  if (idx > 0) {
    const prev = document.getElementById(steps[idx - 1]);
    prev.style.opacity = '.5';
    prev.textContent = '✓ ' + prev.textContent.replace(/^[●○✓] /, '');
  }
  el.style.opacity = '1';
  el.style.color = 'var(--accent)';
  el.textContent = '● ' + text;
}
function showStatus(msg,type){
  const el=document.getElementById('status-bar');
  el.style.display='';
  el.style.borderColor=type==='error'?'var(--red)':'var(--green)';
  el.style.color=type==='error'?'var(--red)':'var(--green)';
  el.textContent=msg;
}
function hideStatus(){document.getElementById('status-bar').style.display='none';}
</script>
{% endblock %}
