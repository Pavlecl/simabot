{% extends "base.html" %}
{% block content %}

<div style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim)">
  Обмен контентом <span style="color:var(--accent)">Ozon ↔ WB</span>
  <span id="active-accounts" style="font-size:10px;color:var(--text-dim);margin-left:12px;text-transform:none;letter-spacing:0"></span>
</div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="match-count" style="font-size:11px;color:var(--text-dim)"></span>
    <button class="btn" id="btn-wb-refresh" onclick="refreshWbCache()" title="Обновить кеш WB карточек">
      ↻ Обновить кеш WB
    </button>
    <button class="btn" id="btn-ozon-sync" onclick="syncOzonDescriptions()" title="Загрузить описания Ozon из API">
      ↻ Синхр. Ozon
    </button>
    <span id="ozon-sync-status" style="font-size:11px;color:var(--text-dim)"></span>
    <button class="btn" id="btn-photo-diff" onclick="refreshPhotoDiff()"
      title="Сравнить главное фото Ozon и WB по содержимому (не по адресу — адреса всегда разные)">
      🖼 Сравнить фото
    </button>
    <span id="photo-diff-status" style="font-size:11px;color:var(--text-dim)"></span>
    <span id="wb-cache-status" style="font-size:11px;color:var(--text-dim)"></span>
    <button class="btn" id="btn-load" onclick="loadProducts()">⟳ Загрузить товары</button>
    <button class="btn primary" id="btn-apply" disabled onclick="applyContent()">
      ↑ Перенести на Ozon (<span id="sel-count">0</span>)
    </button>
  </div>
</div>

<div style="display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
  <input type="text" id="filter-input" placeholder="🔍 Артикул или название…"
    oninput="filterRows(this.value)"
    style="padding:5px 10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;width:240px">
  <label style="font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;gap:4px;align-items:center"
    title="Скрыть строки, где не отмечено ни одно поле (фото, название, описание, характеристики)">
    <input type="checkbox" id="filter-marked-only" onchange="filterRows(document.getElementById('filter-input').value)"> Только отмеченные
  </label>
  <select id="page-size-select" onchange="changePageSize(this.value)"
  style="padding:5px 8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px">
  <option value="50">50</option>
  <option value="100" selected>100</option>
  <option value="200">200</option>
  <option value="500">500</option>
  <option value="999999">Все</option>
</select>
  <div style="display:flex;gap:12px;align-items:center">
    <span style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px">Поля:</span>
    <label style="font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;gap:4px;align-items:center">
      <input type="checkbox" class="col-toggle" data-col="images" checked onchange="toggleCol(this)"> Фото
    </label>
    <label style="font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;gap:4px;align-items:center">
      <input type="checkbox" class="col-toggle" data-col="name" checked onchange="toggleCol(this)"> Название
    </label>
    <label style="font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;gap:4px;align-items:center">
      <input type="checkbox" class="col-toggle" data-col="description" checked onchange="toggleCol(this)"> Описание
    </label>
    <label style="font-size:11px;color:var(--text-dim);cursor:pointer;display:flex;gap:4px;align-items:center">
      <input type="checkbox" class="col-toggle" data-col="attributes" checked onchange="toggleCol(this)"> Характеристики
    </label>
  </div>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button class="btn" style="font-size:11px;padding:3px 10px" onclick="selectAll()">Выбрать все</button>
    <button class="btn" style="font-size:11px;padding:3px 10px" onclick="deselectAll()">Снять все</button>
    <button class="btn" style="font-size:11px;padding:3px 10px;color:var(--accent);border-color:var(--accent)" onclick="selectDiff()">⚡ Только отличия</button>
    <button class="btn" style="font-size:11px;padding:3px 10px;color:var(--accent);border-color:var(--accent)" onclick="selectPhotoDiff()"
      title="Отмечает «Фото» там, где картинки Ozon и WB реально разные — по содержимому, не по адресу">
      📷 Только разные фото
    </button>
  </div>
</div>

<div id="status-bar" style="display:none;margin-bottom:12px;padding:10px 14px;font-size:12px;border-left:3px solid var(--accent)"></div>

<div id="loader" style="display:none;text-align:center;padding:60px 0;color:var(--text-dim)">
  <div id="loader-steps" style="display:inline-flex;flex-direction:column;gap:10px;text-align:left">
    <div id="step-ozon"  style="font-size:12px;opacity:.4">○ Загружаем товары Ozon...</div>
    <div id="step-wb"    style="font-size:12px;opacity:.4">○ Загружаем карточки WB...</div>
    <div id="step-match" style="font-size:12px;opacity:.4">○ Сопоставляем по артикулу...</div>
  </div>
  <div id="loader-timer" style="font-size:11px;color:var(--text-dim);margin-top:16px">0 сек</div>
</div>

<div id="table-wrap" style="display:none">
  <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead>
        <tr style="border-bottom:1px solid var(--border)">
          <th style="width:32px;padding:6px 8px;text-align:center">
            <input type="checkbox" id="check-all" onchange="toggleAll(this.checked)">
          </th>
          <th style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px;width:110px">Артикул</th>
          <th class="th-images" style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px">Фото <span style="color:var(--accent);font-size:9px">WB→OZ</span></th>
          <th class="th-name"   style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px">Название <span style="color:var(--accent);font-size:9px">WB→OZ</span></th>
          <th class="th-description" style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px">Описание <span style="color:var(--accent);font-size:9px">WB→OZ</span></th>
          <th class="th-attributes"  style="padding:6px 8px;text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px">Характеристики <span style="color:var(--accent);font-size:9px">WB→OZ</span></th>
        </tr>
      </thead>
      <tbody id="sync-body"></tbody>
  </table>
<div id="pagination" class="pagination"></div>
</div>

<div id="result-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--surface);border:1px solid var(--border);max-width:600px;width:90%;max-height:80vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)">
      <span style="font-size:12px;text-transform:uppercase;letter-spacing:1px">Результат применения</span>
      <button onclick="closeResultModal()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px">✕</button>
    </div>
    <div id="result-body" style="padding:16px;font-size:12px"></div>
  </div>
</div>

<!-- Модал подтверждения -->
<div id="confirm-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1001;align-items:center;justify-content:center">
  <div style="background:var(--surface);border:1px solid var(--border);max-width:420px;width:90%">
    <div style="padding:20px 20px 8px">
      <div style="font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;color:var(--text)">Подтвердите действие</div>
      <div id="confirm-text" style="font-size:13px;color:var(--text-dim);line-height:1.5"></div>
    </div>
    <div style="display:flex;gap:8px;padding:16px 20px;justify-content:flex-end">
      <button class="btn" id="confirm-cancel" style="font-size:12px">Отмена</button>
      <button class="btn primary" id="confirm-ok" style="font-size:12px">Применить</button>
    </div>
  </div>
</div>

<style>
thead tr th{position:sticky;top:0;z-index:10;background:var(--surface)}
.cmp{display:grid;grid-template-columns:1fr 1fr 24px;gap:4px;align-items:start}
.cmp-lbl{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.val-oz{background:rgba(59,130,246,.08);border-left:2px solid rgba(59,130,246,.3);padding:3px 5px;word-break:break-word}
.val-wb{background:rgba(255,106,0,.06);border-left:2px solid rgba(255,106,0,.2);padding:3px 5px;word-break:break-word}
td.diff .val-wb{background:rgba(255,193,7,.12);border-left:2px solid rgba(255,193,7,.6)}
.thumbs{display:flex;gap:3px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:contain;background:var(--surface2)}
/* Текст с прокруткой — как характеристики */
.txt3{max-height:110px;overflow-y:auto;cursor:default;font-size:11px}
.td-images{width:190px;min-width:190px;max-width:190px}
.td-images .cmp{grid-template-columns:80px 80px 24px}
.td-name{width:200px;min-width:200px}
.td-description{width:300px;min-width:300px}
.td-attributes{width:260px;min-width:260px}
.attr-scroll{max-height:110px;overflow-y:auto}
.attr-scroll div{border-bottom:1px solid var(--border);padding:1px 0;color:var(--text-dim);font-size:11px}
.attr-scroll div b{color:var(--text)}
tr.sel-row{background:rgba(255,106,0,.04)}
tr{border-bottom:1px solid var(--border)}
td{padding:6px;vertical-align:top}
/* Скроллбар для текстовых ячеек */
.txt3::-webkit-scrollbar,
.attr-scroll::-webkit-scrollbar { width: 3px; }
.txt3::-webkit-scrollbar-track,
.attr-scroll::-webkit-scrollbar-track { background: transparent; }
.txt3::-webkit-scrollbar-thumb,
.attr-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; opacity: .6; }
.txt3::-webkit-scrollbar-thumb:hover,
.attr-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); opacity: 1; }
#table-wrap{height:calc(100vh - 180px);overflow:auto}
#table-wrap table{min-width:1200px}

.pagination{display:flex;gap:4px;align-items:center;justify-content:center;padding:12px 0;flex-wrap:wrap}
.pagination button{min-width:32px;height:28px;padding:0 8px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);cursor:pointer}
.pagination button.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:bold}
.pagination button:hover:not(.active):not(:disabled){border-color:var(--accent);color:var(--text)}
.pagination button:disabled{opacity:.3;cursor:default}
</style>

<script>
let allProducts = [];
let filteredProducts = [];
currentPage = 0;
let PAGE_SIZE = 100;
let _loaderTimer = null;
let _loaderSec = 0;
const selectedFields = {}; // {vendor_code: Set<field>}

// ── Загрузка ─────────────────────────────────────────────────────────────────
async function loadProducts() {
  setLoader(true);
  hideStatus();
  document.getElementById('table-wrap').style.display = 'none';
  document.getElementById('match-count').textContent = '';
  try {
    const r    = await fetch('/api/content-sync/products');
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    allProducts = data;
    filteredProducts = data;
    renderTable(data);
    document.getElementById('match-count').textContent = data.length + ' товаров';
    document.getElementById('table-wrap').style.display = '';
  } catch(e) {
    showStatus(e.message, 'error');
  } finally {
    setLoader(false);
  }
}



// Сравниваем фото по содержимому (photo_hamming, 0..64 — Hamming-расстояние
// average hash), а НЕ по URL: Ozon и WB хостят картинки на разных CDN,
// адреса разные всегда, даже если фото буквально одно и то же.
// null/undefined — пара ещё не сравнивалась (нажмите «🖼 Сравнить фото»).
const PHOTO_DIFF_THRESHOLD = 10;
function isPhotoDiff(p) {
  return typeof p.photo_hamming === 'number' && p.photo_hamming >= PHOTO_DIFF_THRESHOLD;
}

// Характеристики — список {name, value}; порядок на Ozon и WB может не
// совпадать, поэтому сравниваем как набор пар "имя::значение", а не строки.
function attrsKey(attrs) {
  return (attrs||[])
    .map(a => `${(a.name||'').trim().toLowerCase()}::${(a.value||'').toString().trim().toLowerCase()}`)
    .sort().join('|');
}
function isAttrsDiff(o, w) {
  return attrsKey(o.attributes) !== attrsKey(w.attributes);
}

function makeRow(p) {
  const o = p.ozon || {}, w = p.wb || {};
  const tr = document.createElement('tr');
  tr.dataset.code = p.vendor_code;
  const imgsDiff = isPhotoDiff(p);
  const nameDiff = (o.name||'') !== (w.name||'');
  const descDiff = (o.description||'') !== (w.description||'');
  const attrsDiff = isAttrsDiff(o, w);
  const ozImgs = (o.images||[]).slice(0,1).map(u => `<img src="${u}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const wbImgs = (w.images||[]).slice(0,1).map(u => `<img src="${u}" loading="lazy" onerror="this.style.display='none'">`).join('');
  const photoHint = typeof p.photo_hamming === 'number'
    ? `<div style="font-size:9px;color:${imgsDiff?'var(--red)':'var(--text-dim)'};margin-top:2px">Δ${p.photo_hamming}</div>`
    : `<div style="font-size:9px;color:var(--text-dim);margin-top:2px">не сравнено</div>`;
  const ozAttrs = (o.attributes||[]).map(a => `<div><b>${x(a.name)}</b>: ${x(a.value)}</div>`).join('');
  const wbAttrs = (w.attributes||[]).map(a => `<div><b>${x(a.name)}</b>: ${x(a.value)}</div>`).join('');
  tr.innerHTML = `
    <td style="text-align:center;width:32px">
      <input type="checkbox" class="row-cb" data-code="${p.vendor_code}" onchange="syncRow(this)">
    </td>
    <td><span style="color:var(--accent);font-size:11px">${x(p.vendor_code)}</span></td>
    <td class="td-images${imgsDiff?' diff':''}">
      <div class="cmp">
        <div><div class="cmp-lbl">Ozon</div><div class="val-oz thumbs">${ozImgs||'<span style="color:var(--text-dim)">нет</span>'}</div></div>
        <div><div class="cmp-lbl">WB</div><div class="val-wb thumbs">${wbImgs||'<span style="color:var(--text-dim)">нет</span>'}</div>${photoHint}</div>
        <div style="padding-top:20px"><input type="checkbox" class="field-cb" data-code="${p.vendor_code}" data-field="images" onchange="onFieldCb(this)"></div>
      </div>
    </td>
    <td class="td-name${nameDiff?' diff':''}">
      <div class="cmp">
        <div><div class="cmp-lbl">Ozon</div><div class="val-oz txt3" title="${x(o.name)}">${x(o.name)}</div></div>
        <div><div class="cmp-lbl">WB</div><div class="val-wb txt3" title="${x(w.name)}">${x(w.name)}</div></div>
        <div style="padding-top:20px"><input type="checkbox" class="field-cb" data-code="${p.vendor_code}" data-field="name" onchange="onFieldCb(this)"></div>
      </div>
    </td>
    <td class="td-description${descDiff?' diff':''}">
      <div class="cmp">
        <div><div class="cmp-lbl">Ozon</div><div class="val-oz txt3" title="${x(o.description)}">${x(o.description)}</div></div>
        <div><div class="cmp-lbl">WB</div><div class="val-wb txt3" title="${x(w.description)}">${x(w.description)}</div></div>
        <div style="padding-top:20px"><input type="checkbox" class="field-cb" data-code="${p.vendor_code}" data-field="description" onchange="onFieldCb(this)"></div>
      </div>
    </td>
    <td class="td-attributes${attrsDiff?' diff':''}">
      <div class="cmp">
        <div><div class="cmp-lbl">Ozon</div><div class="val-oz attr-scroll">${ozAttrs||'—'}</div></div>
        <div><div class="cmp-lbl">WB</div><div class="val-wb attr-scroll">${wbAttrs||'—'}</div></div>
        <div style="padding-top:20px"><input type="checkbox" class="field-cb" data-code="${p.vendor_code}" data-field="attributes" onchange="onFieldCb(this)"></div>
      </div>
    </td>`;
  return tr;
}

// ── Чекбоксы ─────────────────────────────────────────────────────────────────
// silent=true — не перерисовывать фильтр на каждой строке при массовых
// операциях (toggleAll); вызывающий сам обновит фильтр один раз в конце.
function syncRow(master, silent) {
  const code = master.dataset.code;
  if (master.checked) {
    if (!selectedFields[code]) selectedFields[code] = new Set();
    document.querySelectorAll(`.field-cb[data-code="${code}"]`).forEach(cb => {
      cb.checked = true;
      selectedFields[code].add(cb.dataset.field);
    });
    master.closest('tr').classList.add('sel-row');
  } else {
    delete selectedFields[code];
    document.querySelectorAll(`.field-cb[data-code="${code}"]`).forEach(cb => cb.checked = false);
    master.closest('tr').classList.remove('sel-row');
  }
  updateBtn();
  if (!silent) applyMarkedFilterIfActive();
}

function onFieldCb(cb) {
  const code  = cb.dataset.code;
  const field = cb.dataset.field;
  if (cb.checked) {
    if (!selectedFields[code]) selectedFields[code] = new Set();
    selectedFields[code].add(field);
  } else {
    selectedFields[code]?.delete(field);
    if (!selectedFields[code]?.size) delete selectedFields[code];
  }
  updateBtn();
  applyMarkedFilterIfActive();
}

function toggleAll(checked) {
  document.querySelectorAll('.row-cb').forEach(cb => { cb.checked = checked; syncRow(cb, true); });
  applyMarkedFilterIfActive();
}
function selectAll() {
  allProducts.forEach(p => {
    selectedFields[p.vendor_code] = new Set(['images','name','description','attributes']);
  });
  refreshCheckboxes(); updateBtn(); applyMarkedFilterIfActive();
}
function deselectAll() {
  Object.keys(selectedFields).forEach(k => delete selectedFields[k]);
  refreshCheckboxes(); updateBtn(); applyMarkedFilterIfActive();
}
// Отмечает поля, где Ozon и WB реально отличаются — сразу по всем четырём:
// фото (по содержимому, не по URL), название, описание, характеристики.
function selectDiff() {
  allProducts.forEach(p => {
    const o = p.ozon || {}, w = p.wb || {};
    const fields = new Set();
    if (isPhotoDiff(p))                                        fields.add('images');
    if ((o.name||'') !== (w.name||''))                         fields.add('name');
    if ((o.description||'') !== (w.description||''))           fields.add('description');
    if (isAttrsDiff(o, w))                                      fields.add('attributes');
    if (fields.size) selectedFields[p.vendor_code] = fields;
    else delete selectedFields[p.vendor_code];
  });
  refreshCheckboxes(); updateBtn(); applyMarkedFilterIfActive();
}

// Только «Фото» — там, где картинка реально другая (Hamming >= порога).
// Ничего не переносит само по себе — только отмечает чекбоксы, применяет
// перенос отдельная кнопка «Перенести на Ozon» после вашей проверки.
function selectPhotoDiff() {
  let n = 0;
  allProducts.forEach(p => {
    if (!isPhotoDiff(p)) return;
    if (!selectedFields[p.vendor_code]) selectedFields[p.vendor_code] = new Set();
    selectedFields[p.vendor_code].add('images');
    n++;
  });
  refreshCheckboxes(); updateBtn(); applyMarkedFilterIfActive();
  showStatus(`Отмечено карточек с разными фото: ${n} (Hamming ≥ ${PHOTO_DIFF_THRESHOLD} из 64)`, 'ok');
}

// ── Сравнение фото по содержимому ───────────────────────────────────────
async function loadPhotoDiffStatus() {
  try {
    const r = await fetch('/api/content-sync/photo-diff/progress');
    const d = await r.json();
    const el = document.getElementById('photo-diff-status');
    if (d.running) { pollPhotoDiffProgress(); return; }
    if (d.finished_at) {
      const dt = new Date(d.finished_at).toLocaleString('ru');
      el.textContent = `Фото сравнены: ${d.total.toLocaleString('ru')} пар, обновлено ${dt}`;
    } else {
      el.textContent = 'Фото ещё не сравнивались — нажмите 🖼';
      el.style.color = 'var(--red)';
    }
  } catch(e) {}
}

async function refreshPhotoDiff() {
  const btn = document.getElementById('btn-photo-diff');
  btn.disabled = true;
  try {
    const r = await fetch('/api/content-sync/photo-diff/run', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    pollPhotoDiffProgress();
  } catch(e) {
    showStatus('Ошибка: ' + e.message, 'error');
    btn.disabled = false;
  }
}

function pollPhotoDiffProgress() {
  const btn = document.getElementById('btn-photo-diff');
  const statusEl = document.getElementById('photo-diff-status');
  btn.disabled = true;
  btn.textContent = '⏳ Сравниваем...';

  const timer = setInterval(async () => {
    try {
      const r = await fetch('/api/content-sync/photo-diff/progress');
      const d = await r.json();
      statusEl.style.color = 'var(--accent)';
      statusEl.textContent = d.total
        ? `⏳ Сравнено ${d.done.toLocaleString('ru')} из ${d.total.toLocaleString('ru')}...`
        : '⏳ Собираем список пар...';

      if (!d.running) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '🖼 Сравнить фото';
        if (d.error) {
          showStatus('Ошибка сравнения: ' + d.error, 'error');
        } else {
          showStatus(`✓ Фото сравнены: ${d.total.toLocaleString('ru')} пар`, 'ok');
          // Обновляем таблицу, чтобы подтянуть свежие photo_hamming
          if (allProducts.length) loadProducts();
          else loadPhotoDiffStatus();
        }
      }
    } catch(e) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = '🖼 Сравнить фото';
    }
  }, 3000);
}

function refreshCheckboxes() {
  document.querySelectorAll('.field-cb').forEach(cb => {
    const sel = selectedFields[cb.dataset.code];
    cb.checked = sel ? sel.has(cb.dataset.field) : false;
  });
  document.querySelectorAll('.row-cb').forEach(master => {
    const code = master.dataset.code;
    const sel  = selectedFields[code];
    const all4 = sel?.size === 4;
    master.checked       = sel?.size > 0 && all4;
    master.indeterminate = sel?.size > 0 && !all4;
    master.closest('tr').classList.toggle('sel-row', sel?.size > 0);
  });
}

function collectTasks() {
  return Object.entries(selectedFields)
    .filter(([,fields]) => fields.size > 0)
    .map(([code, fields]) => {
      const product = allProducts.find(p => p.vendor_code === code);
      return { vendor_code: code, fields: [...fields], wb_data: product?.wb || null };
    });
}
function updateBtn() {
  const n = Object.values(selectedFields).filter(f => f.size > 0).length;
  document.getElementById('sel-count').textContent = n;
  document.getElementById('btn-apply').disabled = n === 0;
  refreshCheckboxes();
}

// ── Применение ───────────────────────────────────────────────────────────────
async function applyContent() {
  const tasks = collectTasks();
  if (!tasks.length) return;
  const confirmed = await showConfirm(`Перенести WB-контент на Ozon для ${tasks.length} ${tasks.length === 1 ? 'товара' : 'товаров'}?`);
  if (!confirmed) return;
  document.getElementById('btn-apply').disabled = true;
  setLoader(true, `Применяем контент для ${tasks.length} товаров…`);
  hideStatus();
  try {
    const r    = await fetch('/api/content-sync/apply', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ tasks }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    showResults(data);
    // Снимаем чекбоксы у успешно перенесённых товаров
    const okCodes = new Set((data.results || []).filter(r => r.status === 'ok').map(r => r.vendor_code));
    okCodes.forEach(code => delete selectedFields[code]);
    refreshCheckboxes();
    updateBtn();
    applyMarkedFilterIfActive();
  } catch(e) {
    showStatus(e.message, 'error');
  } finally {
    setLoader(false);
    updateBtn();
  }
}
function showResults(data) {
  const ok  = data.results.filter(r => r.status === 'ok');
  const err = data.results.filter(r => r.status !== 'ok');
  let html  = `<div style="color:var(--green);margin-bottom:10px">✓ Успешно: ${ok.length} из ${data.total}</div>`;
  if (err.length) {
    html += `<div style="color:var(--red);margin-bottom:6px">✕ Ошибки (${err.length}):</div><ul style="margin:0;padding-left:16px">`;
    err.forEach(r => html += `<li style="color:var(--text-dim);margin-bottom:2px"><code style="color:var(--accent)">${x(r.vendor_code)}</code>: ${x(r.error)}</li>`);
    html += '</ul>';
  }
  document.getElementById('result-body').innerHTML = html;
  document.getElementById('result-modal').style.display = 'flex';
}
function closeResultModal() { document.getElementById('result-modal').style.display = 'none'; }

// ── Видимость столбцов ───────────────────────────────────────────────────────
function toggleCol(cb) {
  const col = cb.dataset.col;
  document.querySelectorAll(`.td-${col},.th-${col}`).forEach(el => el.style.display = cb.checked ? '' : 'none');
}

// ── Лоадер с прогрессом ──────────────────────────────────────────────────────
function setLoader(on, text) {
  document.getElementById('loader').style.display = on ? '' : 'none';
  document.getElementById('btn-load').disabled    = on;
  if (on && !text) {
    ['step-ozon','step-wb','step-match'].forEach(id => {
      const el = document.getElementById(id);
      el.style.opacity = '.4'; el.style.color = '';
      el.textContent = '○ ' + el.textContent.replace(/^[●○✓] /, '');
    });
    _loaderSec = 0;
    document.getElementById('loader-timer').textContent = '0 сек';
    setTimeout(() => activateStep('step-ozon',  'Загружаем товары Ozon...'), 100);
    setTimeout(() => activateStep('step-wb',    'Загружаем карточки WB...'), 3000);
    setTimeout(() => activateStep('step-match', 'Сопоставляем по артикулу...'), 8000);
    _loaderTimer = setInterval(() => {
      _loaderSec++;
      const el = document.getElementById('loader-timer');
      if (el) el.textContent = _loaderSec + ' сек' + (_loaderSec > 20 ? ' — большой каталог, ждите…' : '');
    }, 1000);
  } else {
    clearInterval(_loaderTimer);
    if (text) document.getElementById('loader-timer').textContent = text;
  }
}
function activateStep(id, text) {
  if (document.getElementById('loader').style.display === 'none') return;
  const steps = ['step-ozon','step-wb','step-match'];
  const idx   = steps.indexOf(id);
  if (idx > 0) {
    const prev = document.getElementById(steps[idx-1]);
    prev.style.opacity = '.5'; prev.style.color = '';
    prev.textContent = '✓ ' + prev.textContent.replace(/^[●○✓] /, '');
  }
  const el = document.getElementById(id);
  el.style.opacity = '1'; el.style.color = 'var(--accent)';
  el.textContent = '● ' + text;
}

// ── Утилиты ──────────────────────────────────────────────────────────────────
function x(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showStatus(msg, type) {
  const el = document.getElementById('status-bar');
  el.style.display = ''; el.style.borderColor = type==='error'?'var(--red)':'var(--green)';
  el.style.color = type==='error'?'var(--red)':'var(--green)'; el.textContent = msg;
}
function hideStatus() { document.getElementById('status-bar').style.display = 'none'; }

// ── Кеш WB ───────────────────────────────────────────────────────────
async function loadWbCacheStatus() {
  try {
    const r = await fetch('/api/content-sync/wb-cache/status');
    const d = await r.json();
    const el = document.getElementById('wb-cache-status');
    if (d.count > 0) {
      const dt = d.updated_at ? new Date(d.updated_at).toLocaleString('ru') : '—';
      el.textContent = `Кеш WB: ${d.count} карточек, обновлён ${dt}`;
    } else {
      el.textContent = 'Кеш WB пуст — нажмите ↻';
      el.style.color = 'var(--red)';
    }
  } catch(e) {}
}

async function refreshWbCache() {
  const btn = document.getElementById('btn-wb-refresh');
  btn.disabled = true;
  try {
    const r = await fetch('/api/content-sync/wb-cache/refresh', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    pollWbProgress();
  } catch(e) {
    showStatus('Ошибка: ' + e.message, 'error');
    btn.disabled = false;
  }
}

function pollWbProgress() {
  const btn = document.getElementById('btn-wb-refresh');
  const statusEl = document.getElementById('wb-cache-status');
  btn.disabled = true;
  btn.textContent = '⏳ Обновляется...';

  const timer = setInterval(async () => {
    try {
      const r  = await fetch('/api/content-sync/wb-cache/progress');
      const d  = await r.json();
      statusEl.style.color = 'var(--accent)';
      statusEl.textContent = `⏳ Загружено карточек WB: ${d.fetched.toLocaleString('ru')}...`;

      if (!d.running) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '↻ Обновить кеш WB';
        if (d.error) {
          showStatus('Ошибка обновления: ' + d.error, 'error');
        } else {
          await loadWbCacheStatus();
          showStatus(`✓ Кеш WB обновлён: ${d.fetched.toLocaleString('ru')} карточек`, 'ok');
        }
      }
    } catch(e) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = '↻ Обновить кеш WB';
    }
  }, 2000);
}

async function syncOzonDescriptions() {
  const btn = document.getElementById('btn-ozon-sync');
  btn.disabled = true;
  btn.textContent = '⏳ Синхронизация...';
  try {
    const r = await fetch('/api/content-sync/sync-ozon-descriptions', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    const timer = setInterval(async () => {
      const p = await fetch('/api/content-sync/sync-ozon-descriptions/progress').then(r=>r.json());
      document.getElementById('ozon-sync-status').textContent =
        `⏳ Ozon: ${p.fetched.toLocaleString('ru')} товаров...`;
      if (!p.running) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '↻ Синхр. Ozon';
        document.getElementById('ozon-sync-status').textContent =
          p.error ? '❌ ' + p.error : `✓ Ozon синхронизирован: ${p.fetched.toLocaleString('ru')}`;
      }
    }, 3000);
  } catch(e) {
    showStatus('Ошибка: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '↻ Синхр. Ozon';
  }
}

function showConfirm(text) {
  return new Promise(resolve => {
    document.getElementById('confirm-text').textContent = text;
    const modal = document.getElementById('confirm-modal');
    modal.style.display = 'flex';
    const ok     = document.getElementById('confirm-ok');
    const cancel = document.getElementById('confirm-cancel');
    const close  = (result) => {
      modal.style.display = 'none';
      ok.replaceWith(ok.cloneNode(true));
      cancel.replaceWith(cancel.cloneNode(true));
      resolve(result);
    };
    document.getElementById('confirm-ok').onclick     = () => close(true);
    document.getElementById('confirm-cancel').onclick = () => close(false);
  });
}

async function loadActiveAccounts() {
  try {
    const r = await fetch('/api/active-accounts');
    const d = await r.json();
    const parts = [];
    if (d.ozon) parts.push(`Ozon: <span style="color:var(--accent)">${d.ozon}</span>`);
    if (d.wb)   parts.push(`WB: <span style="color:#f97316">${d.wb}</span>`);
    document.getElementById('active-accounts').innerHTML = parts.join(' &nbsp;|&nbsp; ');
  } catch(e) {}
}

function renderTable(products) {
  filteredProducts = products;
  currentPage = 0;
  document.getElementById('sync-body').innerHTML = '';
  renderPage(0);
  updateBtn();
}

function renderPage(page) {
  currentPage = page;
  const tbody = document.getElementById('sync-body');
  tbody.innerHTML = '';
  const start = page * PAGE_SIZE;
  const chunk = filteredProducts.slice(start, start + PAGE_SIZE);
  chunk.forEach(p => tbody.appendChild(makeRow(p)));
  refreshCheckboxes(); // ← добавить
  renderPagination();
  document.getElementById('table-wrap').scrollTop = 0;
}

function renderPagination() {
  const total = filteredProducts.length;
  const pages = Math.ceil(total / PAGE_SIZE);
  const el    = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }

  let html = '';
  html += `<button onclick="renderPage(${currentPage-1})" ${currentPage===0?'disabled':''}>‹</button>`;

  // Показываем не все страницы если их много
  let start = Math.max(0, currentPage - 3);
  let end   = Math.min(pages - 1, currentPage + 3);
  if (start > 0) html += `<button onclick="renderPage(0)">1</button>${start>1?'<span style="color:var(--text-dim);padding:0 4px">…</span>':''}`;
  for (let i = start; i <= end; i++) {
    html += `<button onclick="renderPage(${i})" class="${i===currentPage?'active':''}">${i+1}</button>`;
  }
  if (end < pages - 1) html += `${end<pages-2?'<span style="color:var(--text-dim);padding:0 4px">…</span>':''}<button onclick="renderPage(${pages-1})">${pages}</button>`;

  html += `<button onclick="renderPage(${currentPage+1})" ${currentPage===pages-1?'disabled':''}>›</button>`;
  html += `<span style="font-size:11px;color:var(--text-dim);margin-left:8px">${currentPage*PAGE_SIZE+1}–${Math.min((currentPage+1)*PAGE_SIZE, total)} из ${total}</span>`;

  el.innerHTML = html;
}

function changePageSize(val) {
  PAGE_SIZE = parseInt(val);
  renderPage(0);
}

// Текстовый поиск + «Только отмеченные» — работают вместе (И), фильтр по
// отметкам учитывает все четыре поля сразу (фото, название, описание,
// характеристики): строка остаётся, если отмечено хоть одно из них.
function filterRows(q) {
  q = q.toLowerCase();
  const onlyMarked = document.getElementById('filter-marked-only')?.checked;
  filteredProducts = allProducts.filter(p => {
    const name = (p.ozon?.name || '').toLowerCase();
    if (!(p.vendor_code.toLowerCase().includes(q) || name.includes(q))) return false;
    if (onlyMarked) {
      const sel = selectedFields[p.vendor_code];
      return !!sel && sel.size > 0;
    }
    return true;
  });
  renderPage(0);
}

function applyMarkedFilterIfActive() {
  if (document.getElementById('filter-marked-only')?.checked) {
    filterRows(document.getElementById('filter-input').value);
  }
}


loadActiveAccounts();

// Загружаем статус при открытии страницы
loadWbCacheStatus();
loadPhotoDiffStatus();
</script>
{% endblock %}
