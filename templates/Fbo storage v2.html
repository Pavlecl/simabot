{% extends "base.html" %}
{% block title %}FBO — Платное хранение{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <h1>FBO — Платное хранение</h1>
    <span id="updated-at" class="text-muted small"></span>
  </div>
  <div class="page-header-right" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <span id="summary-badge"></span>
    <div id="report-status-block" style="display:flex;align-items:center;gap:8px;">
      <span id="report-status-text" class="small text-muted"></span>
      <button class="btn btn-sm btn-outline-primary" onclick="triggerReport()" id="btn-report">
        📊 Обновить данные хранения
      </button>
    </div>
    <button class="btn btn-sm btn-outline-secondary" onclick="syncStock()" id="sync-btn">
      🔄 Обновить остатки
    </button>
  </div>
</div>

<!-- ФИЛЬТРЫ -->
<div class="card mb-3">
  <div class="card-body py-2" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
    <input type="text" id="search-input" class="form-control form-control-sm"
           placeholder="Поиск по артикулу или названию" style="max-width:280px;" oninput="applyFilters()">
    <select id="filter-urgency" class="form-select form-select-sm" style="max-width:200px;" onchange="applyFilters()">
      <option value="">Все</option>
      <option value="paid">🔴 Уже платное</option>
      <option value="urgent">🟡 До 7 дней</option>
      <option value="soon">🟠 До 14 дней</option>
      <option value="ok">🟢 Более 14 дней</option>
      <option value="unknown">⚪ Нет данных</option>
    </select>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
      <input type="checkbox" id="only-selected" onchange="applyFilters()"> Только выбранные
    </label>
    <span id="filtered-count" class="text-muted small"></span>
  </div>
</div>

<!-- ПАНЕЛЬ АКЦИЙ -->
<div id="actions-panel" class="card mb-3" style="display:none;border-color:var(--bs-warning);">
  <div class="card-body py-2" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
    <span id="selected-count" class="fw-semibold" style="white-space:nowrap;"></span>
    <select id="action-select" class="form-select form-select-sm" style="max-width:360px;">
      <option value="">— Выберите акцию —</option>
    </select>
    <button class="btn btn-sm btn-warning" onclick="openAddToActionModal()"
            id="btn-add-to-action" disabled>Добавить в акцию →</button>
    <button class="btn btn-sm btn-outline-secondary" onclick="clearSelection()">Снять выбор</button>
  </div>
</div>

<!-- ТАБЛИЦА -->
<div class="card">
  <div class="card-body p-0">
    <div id="loading-state" class="text-center py-5 text-muted">
      <div class="spinner-border spinner-border-sm me-2"></div> Загрузка…
    </div>
    <div id="table-wrap" style="display:none;overflow-x:auto;">
      <table class="table table-sm table-hover mb-0" id="main-table">
        <thead>
          <tr>
            <th style="width:36px;padding:8px 6px 8px 12px;">
              <input type="checkbox" id="check-all" onchange="toggleAll(this.checked)">
            </th>
            <th style="cursor:pointer;" onclick="sortBy('offer_id')">Артикул <span class="sort-icon" data-col="offer_id"></span></th>
            <th>Название</th>
            <th style="cursor:pointer;text-align:center;" onclick="sortBy('fbo')">FBO <span class="sort-icon" data-col="fbo"></span></th>
            <th style="cursor:pointer;text-align:center;" onclick="sortBy('days_left')">До платного <span class="sort-icon" data-col="days_left"></span></th>
            <th style="text-align:center;">Дата платности</th>
            <th style="cursor:pointer;text-align:center;" onclick="sortBy('paid_qty')">Платно, шт <span class="sort-icon" data-col="paid_qty"></span></th>
            <th style="cursor:pointer;text-align:right;" onclick="sortBy('daily_cost_28d')">Списано за 28д, ₽ <span class="sort-icon" data-col="daily_cost_28d"></span></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div id="empty-state" class="text-center py-5 text-muted" style="display:none;">
      Нет товаров с остатками FBO
    </div>
  </div>
</div>

<!-- МОДАЛКА: добавление в акцию -->
<div class="modal fade" id="addToActionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Добавить в акцию</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="modal-action-name" class="fw-semibold mb-3"></p>
        <div id="modal-products-list" style="max-height:340px;overflow-y:auto;font-size:13px;"></div>
        <div id="modal-warning" class="alert alert-warning mt-3" style="display:none;font-size:13px;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
        <button class="btn btn-warning btn-sm" id="btn-confirm-add" onclick="confirmAddToAction()">Добавить</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;"></div>

<style>
.urgency-paid   { color:#dc3545;font-weight:600; }
.urgency-urgent { color:#fd7e14;font-weight:600; }
.urgency-soon   { color:#ffc107; }
.urgency-ok     { color:#198754; }
.urgency-unknown{ color:#6c757d; }
.dot { display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px; }
.dot-paid   { background:#dc3545; }
.dot-urgent { background:#fd7e14; }
.dot-soon   { background:#ffc107; }
.dot-ok     { background:#198754; }
.dot-unknown{ background:#adb5bd; }
.sort-icon::after        { content:' ↕';opacity:.3;font-size:11px; }
.sort-icon.asc::after    { content:' ↑';opacity:1; }
.sort-icon.desc::after   { content:' ↓';opacity:1; }
#main-table thead th { white-space:nowrap;font-size:13px; }
#main-table tbody td { font-size:13px;vertical-align:middle; }

/* Статус отчёта */
.report-running { color:#0d6efd; }
.report-done    { color:#198754; }
.report-error   { color:#dc3545; }
</style>

<script>
let allItems = [];
let filteredItems = [];
let selectedIds = new Set();
let sortCol = 'days_left';
let sortDir = 'asc';
let actionsLoaded = false;
let candidatesCache = {};
let reportPollingTimer = null;

// ─── ЗАГРУЗКА ДАННЫХ ──────────────────────────────────────────────

async function loadItems() {
  showLoading(true);
  try {
    const r = await fetch('/api/fbo-storage/items');
    const data = await r.json();

    updateReportStatus(data.report_status, data.report_updated_at, data.report_error);

    if (data.loading) {
      document.getElementById('loading-state').innerHTML =
        '<div class="spinner-border spinner-border-sm me-2"></div> Кэш остатков обновляется…';
      setTimeout(loadItems, 3000);
      return;
    }

    allItems = data.items || [];
    if (data.updated_at) {
      document.getElementById('updated-at').textContent = 'Остатки: ' + data.updated_at;
    }

    // Если данных хранения нет — автоматически запускаем отчёт
    const hasStorageData = allItems.some(i => i.days_left !== null);
    if (!hasStorageData && data.report_status === 'empty') {
      triggerReport();
    }

    updateSummary();
    applyFilters();
    loadActions();
  } catch(e) {
    showLoading(false);
    toast('Ошибка загрузки: ' + e.message, 'danger');
  }
}

async function triggerReport() {
  const btn = document.getElementById('btn-report');
  btn.disabled = true;
  try {
    const r = await fetch('/api/fbo-storage/report/trigger', {method:'POST'});
    const d = await r.json();
    if (d.ok) {
      updateReportStatus('running', null, null);
      startPolling();
    } else {
      toast(d.message, 'warning');
      btn.disabled = false;
    }
  } catch(e) {
    toast('Ошибка запуска: ' + e.message, 'danger');
    btn.disabled = false;
  }
}

function startPolling() {
  if (reportPollingTimer) clearInterval(reportPollingTimer);
  reportPollingTimer = setInterval(async () => {
    try {
      const r = await fetch('/api/fbo-storage/report/status');
      const d = await r.json();
      updateReportStatus(d.status, d.updated_at, d.error);
      if (d.status === 'done') {
        clearInterval(reportPollingTimer);
        reportPollingTimer = null;
        // Перезагружаем данные с новыми данными хранения
        await loadItems();
        toast('Данные хранения обновлены', 'success');
      } else if (d.status === 'error') {
        clearInterval(reportPollingTimer);
        reportPollingTimer = null;
        toast('Ошибка отчёта: ' + d.error, 'danger');
      }
    } catch(e) {}
  }, 6000);
}

function updateReportStatus(status, updatedAt, error) {
  const el = document.getElementById('report-status-text');
  const btn = document.getElementById('btn-report');
  if (status === 'running') {
    el.innerHTML = '<span class="report-running"><span class="spinner-border spinner-border-sm me-1" style="width:.7rem;height:.7rem;"></span>Формируется отчёт…</span>';
    btn.disabled = true;
  } else if (status === 'done') {
    el.innerHTML = `<span class="report-done">✓ Данные от ${updatedAt || ''}</span>`;
    btn.disabled = false;
  } else if (status === 'error') {
    el.innerHTML = `<span class="report-error">⚠ Ошибка</span>`;
    btn.title = error || '';
    btn.disabled = false;
  } else {
    el.innerHTML = '<span class="text-muted">Данных хранения нет</span>';
    btn.disabled = false;
  }
}

async function syncStock() {
  const btn = document.getElementById('sync-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Синхронизация…';
  await fetch('/api/stock/fbo/sync', {method:'POST'});
  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = '🔄 Обновить остатки';
    loadItems();
  }, 5000);
}

async function loadActions() {
  if (actionsLoaded) return;
  try {
    const r = await fetch('/api/fbo-storage/actions');
    const data = await r.json();
    const sel = document.getElementById('action-select');
    sel.innerHTML = '<option value="">— Выберите акцию —</option>';
    (data.actions || []).forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      const dateStr = a.date_end ? ' (до ' + fmtDate(a.date_end) + ')' : '';
      opt.textContent = a.title + dateStr;
      opt.dataset.title = a.title;
      sel.appendChild(opt);
    });
    actionsLoaded = true;
  } catch(e) { console.warn('actions load failed', e); }
}

// ─── РЕНДЕР ───────────────────────────────────────────────────────

function applyFilters() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const urgency = document.getElementById('filter-urgency').value;
  const onlySelected = document.getElementById('only-selected').checked;

  filteredItems = allItems.filter(item => {
    if (q && !item.offer_id.toLowerCase().includes(q) && !item.name.toLowerCase().includes(q)) return false;
    if (onlySelected && !selectedIds.has(item.offer_id)) return false;
    if (urgency && getUrgency(item.days_left) !== urgency) return false;
    return true;
  });

  filteredItems.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (sortCol === 'days_left') {
      va = va === null ? 99999 : va;
      vb = vb === null ? 99999 : vb;
    }
    if (va === null || va === undefined) va = '';
    if (vb === null || vb === undefined) vb = '';
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  renderTable();
  document.getElementById('filtered-count').textContent =
    filteredItems.length + ' из ' + allItems.length + ' позиций';
}

function renderTable() {
  showLoading(false);
  const tbody = document.getElementById('table-body');

  if (!filteredItems.length) {
    document.getElementById('table-wrap').style.display = 'none';
    document.getElementById('empty-state').style.display = '';
    return;
  }
  document.getElementById('table-wrap').style.display = '';
  document.getElementById('empty-state').style.display = 'none';

  tbody.innerHTML = filteredItems.map(item => {
    const urgency = getUrgency(item.days_left);
    const checked = selectedIds.has(item.offer_id) ? 'checked' : '';
    const rowCls = selectedIds.has(item.offer_id) ? 'table-active' : '';
    const daysCell = formatDaysCell(item.days_left, urgency);
    const paidDate = item.paid_date ? fmtDate(item.paid_date) : '—';
    const paidQty = item.paid_qty > 0
      ? `<span style="color:#dc3545;font-weight:600;">${item.paid_qty}</span>`
      : `<span style="color:#6c757d;">0</span>`;
    const cost = item.daily_cost_28d > 0
      ? `<span style="color:#dc3545;">${item.daily_cost_28d.toFixed(2)}</span>`
      : '—';

    return `<tr class="${rowCls}">
      <td style="padding:8px 6px 8px 12px;">
        <input type="checkbox" ${checked} onchange="toggleItem('${esc(item.offer_id)}', this.checked)">
      </td>
      <td style="font-family:monospace;font-size:12px;">${esc(item.offer_id)}</td>
      <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
          title="${esc(item.name)}">${esc(item.name)}</td>
      <td style="text-align:center;font-weight:600;">${item.fbo}</td>
      <td style="text-align:center;">${daysCell}</td>
      <td style="text-align:center;font-size:12px;color:var(--bs-secondary);">${paidDate}</td>
      <td style="text-align:center;">${paidQty}</td>
      <td style="text-align:right;">${cost}</td>
    </tr>`;
  }).join('');

  document.getElementById('check-all').checked = false;
}

function formatDaysCell(days, urgency) {
  if (days === null || days === undefined)
    return '<span class="urgency-unknown">—</span>';
  if (days < 0)
    return `<span class="dot dot-paid"></span><span class="urgency-paid">Платное</span>`;
  if (days === 0)
    return `<span class="dot dot-urgent"></span><span class="urgency-urgent">Сегодня</span>`;
  const cls = {urgent:'urgency-urgent',soon:'urgency-soon',ok:'urgency-ok'}[urgency] || '';
  return `<span class="dot dot-${urgency}"></span><span class="${cls}">${days} дн.</span>`;
}

function getUrgency(days) {
  if (days === null || days === undefined) return 'unknown';
  if (days < 0)  return 'paid';
  if (days <= 7) return 'urgent';
  if (days <= 14) return 'soon';
  return 'ok';
}

function updateSummary() {
  const paid   = allItems.filter(i => i.days_left !== null && i.days_left < 0).length;
  const urgent = allItems.filter(i => i.days_left !== null && i.days_left >= 0 && i.days_left <= 7).length;
  let html = `${allItems.length} позиций`;
  if (paid)   html += ` · <span style="color:#dc3545;font-weight:600;">${paid} платных</span>`;
  if (urgent) html += ` · <span style="color:#fd7e14;font-weight:600;">${urgent} срочных</span>`;
  document.getElementById('summary-badge').innerHTML = html;
}

// ─── ВЫБОР ────────────────────────────────────────────────────────

function toggleItem(offerId, checked) {
  if (checked) selectedIds.add(offerId); else selectedIds.delete(offerId);
  updateSelectionPanel();
  applyFilters();
}
function toggleAll(checked) {
  filteredItems.forEach(i => checked ? selectedIds.add(i.offer_id) : selectedIds.delete(i.offer_id));
  updateSelectionPanel();
  applyFilters();
}
function clearSelection() {
  selectedIds.clear();
  updateSelectionPanel();
  document.getElementById('only-selected').checked = false;
  applyFilters();
}
function updateSelectionPanel() {
  const panel = document.getElementById('actions-panel');
  const btn = document.getElementById('btn-add-to-action');
  const sel = document.getElementById('action-select');
  if (selectedIds.size > 0) {
    panel.style.display = '';
    document.getElementById('selected-count').textContent = `Выбрано: ${selectedIds.size}`;
    btn.disabled = !sel.value;
  } else {
    panel.style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('action-select').addEventListener('change', () => {
    document.getElementById('btn-add-to-action').disabled =
      !document.getElementById('action-select').value;
  });
});

// ─── АКЦИИ ────────────────────────────────────────────────────────

async function openAddToActionModal() {
  const sel = document.getElementById('action-select');
  const actionId = parseInt(sel.value);
  if (!actionId) return;
  const actionTitle = sel.options[sel.selectedIndex].dataset.title;
  document.getElementById('modal-action-name').textContent = actionTitle;

  const listEl = document.getElementById('modal-products-list');
  const warnEl = document.getElementById('modal-warning');
  warnEl.style.display = 'none';
  listEl.innerHTML = '<div class="text-muted"><span class="spinner-border spinner-border-sm me-1"></span> Загружаем кандидатов…</div>';

  const modal = new bootstrap.Modal(document.getElementById('addToActionModal'));
  modal.show();

  if (!candidatesCache[actionId]) {
    try {
      const r = await fetch(`/api/fbo-storage/action-products/${actionId}`);
      candidatesCache[actionId] = (await r.json()).products || [];
    } catch(e) {
      listEl.innerHTML = '<div class="text-danger">Ошибка загрузки кандидатов</div>';
      return;
    }
  }

  const candidateMap = {};
  candidatesCache[actionId].forEach(c => {
    candidateMap[c.offer_id || c.id] = c;
  });

  const selectedItems = allItems.filter(i => selectedIds.has(i.offer_id));
  const matched = [], notMatched = [];
  selectedItems.forEach(item => {
    const cand = candidateMap[item.offer_id];
    if (cand) matched.push({item, cand});
    else notMatched.push(item);
  });

  let html = '';
  if (matched.length) {
    html += `<div class="text-success mb-2 fw-semibold">✅ Можно добавить (${matched.length})</div>`;
    html += matched.map(({item, cand}) =>
      `<div style="padding:4px 0;border-bottom:1px solid var(--bs-border-color);">
        <span style="font-family:monospace;font-size:11px;">${esc(item.offer_id)}</span>
        <span class="text-muted"> — </span>${esc(item.name.substring(0,50))}
        <span class="float-end text-success fw-semibold">${cand.action_price || '?'} ₽</span>
      </div>`
    ).join('');
  }
  if (notMatched.length) {
    html += `<div class="text-danger mt-3 mb-2 fw-semibold">❌ Не являются кандидатами (${notMatched.length})</div>`;
    html += notMatched.map(i =>
      `<div style="padding:3px 0;color:var(--bs-secondary);font-size:12px;">${esc(i.offer_id)}</div>`
    ).join('');
  }
  listEl.innerHTML = html || '<div class="text-muted">Нет совпадений</div>';

  const confirmBtn = document.getElementById('btn-confirm-add');
  if (!matched.length) {
    warnEl.textContent = 'Ни один из выбранных товаров не является кандидатом для этой акции.';
    warnEl.style.display = '';
    confirmBtn.disabled = true;
  } else {
    confirmBtn.disabled = false;
    confirmBtn.dataset.actionId = actionId;
    confirmBtn.dataset.matched = JSON.stringify(
      matched.map(({cand}) => ({
        product_id: cand.id || cand.product_id,
        action_price: cand.action_price,
      }))
    );
  }
}

async function confirmAddToAction() {
  const btn = document.getElementById('btn-confirm-add');
  const actionId = parseInt(btn.dataset.actionId);
  const products = JSON.parse(btn.dataset.matched || '[]');
  btn.disabled = true;
  btn.textContent = 'Добавляем…';
  try {
    const r = await fetch('/api/fbo-storage/actions/add', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action_id: actionId, products})
    });
    const data = await r.json();
    bootstrap.Modal.getInstance(document.getElementById('addToActionModal')).hide();
    if (data.ok) {
      let msg = `Добавлено: ${data.added_count}`;
      if (data.rejected_count) msg += `, отклонено: ${data.rejected_count}`;
      toast(msg, data.rejected_count > 0 ? 'warning' : 'success');
    } else {
      toast('Ошибка: ' + JSON.stringify(data), 'danger');
    }
  } catch(e) {
    toast('Ошибка: ' + e.message, 'danger');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Добавить';
  }
}

// ─── СОРТИРОВКА ───────────────────────────────────────────────────

function sortBy(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortCol = col; sortDir = 'asc'; }
  document.querySelectorAll('.sort-icon').forEach(el => el.className = 'sort-icon');
  const icon = document.querySelector(`.sort-icon[data-col="${col}"]`);
  if (icon) icon.className = 'sort-icon ' + sortDir;
  applyFilters();
}

// ─── УТИЛИТЫ ──────────────────────────────────────────────────────

function showLoading(show) {
  document.getElementById('loading-state').style.display = show ? '' : 'none';
  if (show) {
    document.getElementById('table-wrap').style.display = 'none';
    document.getElementById('empty-state').style.display = 'none';
  }
}
function fmtDate(iso) {
  if (!iso) return '—';
  return String(iso).substring(0,10).split('-').reverse().join('.');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `alert alert-${type} py-2 px-3 mb-0 shadow-sm`;
  el.style.cssText = 'font-size:13px;min-width:240px;';
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ─── СТАРТ ────────────────────────────────────────────────────────

loadItems();

// Если отчёт уже формируется при загрузке — запускаем polling
fetch('/api/fbo-storage/report/status').then(r=>r.json()).then(d => {
  if (d.status === 'running') startPolling();
});
</script>
{% endblock %}
